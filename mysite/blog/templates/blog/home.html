{% extends 'blog/base.html' %}
{% block title %}Home{% endblock %}
{% block content %}
    <h2>Welcome to my Blog!</h2>
        <ul>
            {% for post in posts %}
                <li> {{ post.title }} - {{ post.created_at }} </li>
            {% empty %}
                <li>No posts yet!</li>
            {% endfor %}
        </ul>
{% endblock %}
